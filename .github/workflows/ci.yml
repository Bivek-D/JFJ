name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  path-guard:
    # Only fork PRs (the frontend developer) are restricted to frontend/.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fail if files outside frontend/ changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          outside=$(git diff --name-only "origin/$BASE_REF...HEAD" | grep -v '^frontend/' || true)
          if [ -n "$outside" ]; then
            echo "Fork PRs may only change frontend/. Found:"
            echo "$outside"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Skip while frontend is empty
        if: hashFiles('frontend/package.json') == ''
        run: echo "No frontend/package.json yet, nothing to check."

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Build Docker image
        run: docker build -t jfj-backend .

  deploy:
    # Only after a merge to main, and only when the other CI jobs passed.
    # path-guard is left out of needs: it only runs on PRs, and a skipped need would skip this job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    environment: production        # waits for owner approval; unlocks the hook secret
    concurrency:
      group: production-deploy     # one deploy at a time, never two at once
      cancel-in-progress: false
    env:
      APP_URL: https://jfj-s529.onrender.com
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - name: Trigger Render deploy of this exact commit
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        # The hook URL already contains ?key=..., so ref is appended with &.
        run: curl -fsS -X POST "${DEPLOY_HOOK}&ref=${EXPECTED_COMMIT}" > /dev/null

      - name: Wait for the new version, then check health
        # /actuator/info reports RENDER_GIT_COMMIT, which tells the new version from the old one.
        run: |
          for i in $(seq 1 40); do    # 40 tries x 15 s = 10 minutes max
            live=$(curl -fsS --max-time 60 "$APP_URL/actuator/info" | jq -r '.app.commit // empty' || true)
            echo "Try $i: live commit is ${live:-unreachable}"
            if [ "$live" = "$EXPECTED_COMMIT" ]; then
              curl -fsS --max-time 60 "$APP_URL/actuator/health" | jq -e '.status == "UP"'
              echo "Deployed $EXPECTED_COMMIT and healthy."
              exit 0
            fi
            sleep 15
          done
          echo "New version did not go live within 10 minutes. The old version is still serving."
          exit 1
